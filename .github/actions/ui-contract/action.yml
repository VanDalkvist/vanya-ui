name: Vanya UI contract
description: Fail changed UI features that bypass canonical components or browser test entrypoints
inputs:
  mode:
    description: auto, react, visual, or off for genuinely non-UI repos
    required: false
    default: auto
  base-sha:
    required: false
    default: ""
    description: Pull request base or previous push SHA
  root:
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Check Vanya UI consumer contract
      shell: bash
      env:
        VANYA_UI_MODE: ${{ inputs.mode }}
        VANYA_UI_BASE: ${{ inputs.base-sha }}
        VANYA_UI_ROOT: ${{ inputs.root }}
      run: node "${{ github.action_path }}/check.mjs"
