# Public component showcase. Deployments are initiated manually in Cloudflare Workers Builds.
# The only source is the public Vanya UI repository. Never put credentials or app data here.
name = "vanya-ui"
compatibility_date = "2026-11-21"
workers_dev = false
preview_urls = false
keep_vars = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
